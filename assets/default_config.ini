; face_client 默认配置（首启自动生成 config.ini，可手动编辑；改后重启生效）
; 注意：布尔型字段用 1/0；颜色用 6 位十六进制（不带 #）；消息单行，用 | 分段

[general]
minimize_on_close=1      ; 点关闭按钮时 1=最小化到托盘 0=直接退出
single_instance=1        ; 1=禁止多开

[face]
model_path=models/face_recognition_sface_2021dec.onnx
detect_min_score=0.50    ; libfacedetection 检测置信度下限
align_size=112           ; SFace 输入尺寸
input_mean=127.5         ; 预处理均值（opencv_zoo SFace 约定）
input_std=128.0          ; 预处理标准差
swap_rb=1                ; 1=喂给模型 RGB 0=BGR

[recognition]
threshold=0.50           ; 余弦相似度阈值（越大越严；SFace 经验约0.363，0.5偏严）
min_detection_score=0.50 ; MQTT payload.score 下限
cooldown_seconds=30      ; 同 track_id/同人冷却，防刷屏
alert_on_unknown=1       ; 未知人脸是否弹窗
unknown_alert_level=1
aggregate_low_threshold=0.20   ; 聚合: 新特征与聚合体相似度低于此值警告(可能贴错人)
aggregate_high_threshold=0.95  ; 聚合: 高于此值提示(可能重复录入)
face_match_threshold=0.50      ; 新增人员时撞脸检查阈值
aggregate_soft_cap=10          ; 每人样本数软上限(超出提示)

[mqtt]
enabled=0
host=
port=1883
topic=facedetect/events
client_id=face_client
username=
password=
qos=1
keepalive=60
reconnect_delay=5

[storage]
db_path=templates.db

[ui]
popup_duration_ms=6000
popup_max_visible=3

[notifications]
; level_N = 标题|颜色RRGGBB|停留毫秒(0=不自动关)|是否声音1/0
level_0=已知人员|2E7D32|4000|0
level_1=提醒|F9A825|6000|1
level_2=重要告警|C62828|0|1
unknown_title=未知人员
unknown_message=检测到未登记人员 | 设备:{device_id} | 置信度:{score:.2f} | 时间:{time}
known_message=识别到:{name} | 设备:{device_id} | 相似度:{score:.2f} | 时间:{time}
